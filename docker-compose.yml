# Local development database. The credentials are for local use only and match
# appsettings.Development.json; never reuse them anywhere else.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rackline
      POSTGRES_PASSWORD: rackline_dev
      POSTGRES_DB: rackline
    ports:
      - "5432:5432"
    volumes:
      - rackline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rackline -d rackline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rackline-pgdata:
